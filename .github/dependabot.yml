version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet-extensions:
        patterns: ['Microsoft.Extensions.*', 'Microsoft.Data.Sqlite']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
