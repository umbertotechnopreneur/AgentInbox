name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag and source
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $expected = 'v' + $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne $expected) { throw 'Tag does not match the project version.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release source must be reachable from main.' }
  quality:
    needs: verify
    uses: ./.github/workflows/ci.yml
  tests:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Run synthetic tests
        run: dotnet test MailMeUp.slnx -c Release --logger "console;verbosity=minimal"
  package-portable:
    needs: [quality, tests]
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependency graph
        run: dotnet restore MailMeUp.slnx --locked-mode
      - name: Publish and archive
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package-windows-portable.ps1 -Runtime '${{ matrix.rid }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
  package-msix:
    needs: [quality, tests]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
      MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
      MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
      MSIX_TIMESTAMP_SERVER: ${{ secrets.MSIX_TIMESTAMP_SERVER }}
    steps:
      - name: Check optional MSIX signing configuration
        id: signing
        shell: pwsh
        run: |
          $required = @('MSIX_CERTIFICATE_BASE64', 'MSIX_CERTIFICATE_PASSWORD', 'MSIX_PUBLISHER', 'MSIX_PUBLISHER_DISPLAY_NAME', 'MSIX_TIMESTAMP_SERVER')
          $configured = @($required | Where-Object { -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($configured.Count -eq 0) {
            'available=false' >> $env:GITHUB_OUTPUT
            Write-Warning 'MSIX signing is not configured. Release portable ZIPs and attach a locally signed installer separately if needed.'
          } elseif ($configured.Count -ne $required.Count) {
            $missing = $required | Where-Object { $_ -notin $configured }
            throw "Incomplete MSIX signing configuration. Missing GitHub secrets: $($missing -join ', ')"
          } else {
            'available=true' >> $env:GITHUB_OUTPUT
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.signing.outputs.available == 'true'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.signing.outputs.available == 'true'
        with:
          global-json-file: global.json
      - name: Import release signing certificate
        if: steps.signing.outputs.available == 'true'
        id: certificate
        shell: pwsh
        run: |
          foreach ($name in 'MSIX_CERTIFICATE_BASE64', 'MSIX_CERTIFICATE_PASSWORD', 'MSIX_PUBLISHER', 'MSIX_PUBLISHER_DISPLAY_NAME', 'MSIX_TIMESTAMP_SERVER') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing required GitHub secret: $name" }
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'mailmeup-release-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:MSIX_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.HasPrivateKey) { throw 'The imported release certificate has no private key.' }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          "path=$certificatePath" >> $env:GITHUB_OUTPUT
      - name: Build and sign x64 MSIX
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          pwsh -NoProfile -File scripts/package-msix.ps1 -Architecture x64 -PackageVersion "$version.0" -Publisher $env:MSIX_PUBLISHER -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT -TimestampServer $env:MSIX_TIMESTAMP_SERVER
      - name: Remove imported signing material
        if: always() && steps.signing.outputs.available == 'true'
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
          CERTIFICATE_PATH: ${{ steps.certificate.outputs.path }}
        run: |
          if ($env:CERTIFICATE_THUMBPRINT) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:CERTIFICATE_THUMBPRINT" -Force -ErrorAction SilentlyContinue }
          if ($env:CERTIFICATE_PATH) { Remove-Item -LiteralPath $env:CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.signing.outputs.available == 'true'
        with:
          name: package-msix-x64
          path: |
            artifacts/msix/**/*.msix
            artifacts/msix/**/*.cer
            artifacts/msix/**/*.sha256
          if-no-files-found: error
  draft:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [package-portable, package-msix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$existing" = 'true' ]; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          elif [ "$existing" = 'false' ]; then
            echo 'The release is already published; its assets must not be replaced by this workflow.' >&2
            exit 1
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease --generate-notes --title "MailMeUp $RELEASE_TAG"
          fi
