name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag and source
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $expected = 'v' + $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne $expected) { throw 'Tag does not match the project version.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release source must be reachable from main.' }
  quality:
    needs: verify
    uses: ./.github/workflows/ci.yml
  tests:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Run synthetic tests
        run: dotnet test MailMeUp.slnx -c Release --logger "console;verbosity=minimal"
  package-portable:
    needs: [quality, tests]
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependency graph
        run: dotnet restore MailMeUp.slnx --locked-mode
      - name: Publish and archive
        shell: pwsh
        run: pwsh -NoProfile -File scripts/AgentInbox.ps1 -Command package-portable -Runtime '${{ matrix.rid }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
  draft:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package-portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$existing" = 'true' ]; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          elif [ "$existing" = 'false' ]; then
            echo 'The release is already published; its assets must not be replaced by this workflow.' >&2
            exit 1
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease --generate-notes --title "AgentInbox $RELEASE_TAG"
          fi
